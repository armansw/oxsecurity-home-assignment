name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # nightly: large-repository e2e against fresh upstream commits

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Forbidden APIs are absent from src/
        run: "! grep -rnE 'JSON\\.parse\\(|readFile(Sync)?\\(' src/"
      - name: OOM check — 600 MB report under --max-old-space-size=150
        run: npm run oom:check
      - name: OOM check — every finding CRITICAL (stresses the store path)
        run: node --max-old-space-size=150 dist/scripts/oom-check.js --size-mb 300 --critical-ratio 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker-e2e:
    name: docker e2e (${{ matrix.name }})
    needs: [backend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Real Trivy scan, full stack: also builds the web image and checks the UI + nginx proxy.
          - { name: "trivy + web UI, 200m", files: "", services: "", flag: "", web: "http://localhost:8080" }
          - { name: "600 MB fixture, 200m", files: "-f docker-compose.oom.yml", services: app, flag: --fixture, web: "" }
          # Tighter than the brief.
          - { name: "600 MB fixture, 150m", files: "-f docker-compose.oom.yml -f docker-compose.150m.yml", services: app, flag: --fixture, web: "", extra: docker-compose.150m.yml }
          # API and worker as separate containers.
          - { name: "split api/worker + web UI", files: "-f docker-compose.split.yml", services: "", flag: --split, web: "http://localhost:8080" }
    env:
      EXTRA_COMPOSE_FILES: ${{ matrix.extra }}
      WEB_URL: ${{ matrix.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start stack
        run: docker compose -f docker-compose.yml ${{ matrix.files }} up --build -d --wait ${{ matrix.services }}
      - name: Scan inside the memory-limited container
        run: ./scripts/e2e-docker.sh ${{ matrix.flag }}
      - name: Diagnostics
        if: always()
        run: |
          docker compose -f docker-compose.yml ${{ matrix.files }} ps -a
          for c in $(docker compose -f docker-compose.yml ${{ matrix.files }} ps -aq); do docker inspect -f '{{.Name}} {{json .State.OOMKilled}} exit={{.State.ExitCode}}' "$c"; done
          sudo dmesg | grep -iE 'oom|killed process|memory cgroup' | tail -20 || true
          docker compose -f docker-compose.yml ${{ matrix.files }} logs --tail 100

  run-sh:
    name: ./run.sh from scratch (${{ matrix.os }})
    needs: [backend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Doctor
        run: ./run.sh doctor
      - name: Bootstrap Node + Trivy locally, build, run, scan, Ctrl-C
        env:
          CG_FORCE_LOCAL_TOOLS: "1"
        run: ./scripts/smoke-run.sh

  large-repos:
    name: large repositories, verified against Trivy (service at 150m, strict)
    needs: [backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space for multi-GB clones
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install the same Trivy (checksum verified) for the independent ground truth
        run: |
          V=0.76.1; cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v$V/trivy_${V}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v$V/trivy_${V}_checksums.txt"
          grep "Linux-64bit.tar.gz$" "trivy_${V}_checksums.txt" | sha256sum -c -
          tar xzf "trivy_${V}_Linux-64bit.tar.gz" trivy && sudo install -m755 trivy /usr/local/bin/trivy
      - name: Start stack (service limited to 150 MB; git + Trivy in the scanner container)
        run: docker compose -f docker-compose.yml -f docker-compose.150m.yml -f docker-compose.large.yml up --build -d --wait app
      - name: Scan large repositories and verify every CRITICAL finding
        run: |
          python3 -u scripts/large_repos_e2e.py --trivy-offline --strict-limit --api http://localhost:3000 \
            --trivy-server http://localhost:4954 --trivy-token change-me-local-token \
            --container "$(docker compose ps -q app)" --json-out large-repos.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: large-repos-results
          path: large-repos.json
      - name: Diagnostics
        if: always()
        run: |
          docker inspect -f '{{json .State}}' $(docker compose ps -aq app) || true
          sudo dmesg | grep -iE 'oom|killed process|memory cgroup' | tail -20 || true
          docker compose logs --tail 150 app
