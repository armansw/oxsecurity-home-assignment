# A security scanner should not ship stale dependencies. Weekly, grouped, patch/minor only: major upgrades
# (a new Node line, @types/node for a newer runtime) are deliberate decisions made in their own PR, not bot noise.
# Security updates are separate from this file and still arrive for any version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production: { dependency-type: production }
      development: { dependency-type: development }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
