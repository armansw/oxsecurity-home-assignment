# Large-repository load test (scripts/large_repos_e2e.py):
# - publish the Trivy server on localhost so the independent ground-truth run uses the same vulnerability DB;
# - allow a whole shard to be submitted at once (queue cap and per-IP rate limit raised for the test client).
services:
  trivy:
    ports: ["127.0.0.1:4954:4954"]
  app:
    environment:
      MAX_QUEUED: 1000
      RATE_LIMIT_PER_MIN: 10000
  # Shared CI runner IPs get HTTP 429 from Maven Central for POM lookups (Retry-After: 30 min). Offline scanning
  # keeps the run deterministic; the verifier passes --trivy-offline so both sides use identical Trivy flags.
  scanner:
    environment:
      TRIVY_OFFLINE_SCAN: "true"
